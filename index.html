/* 정렬 버튼 스타일 */
.align-btn {

.hidden { display: none !important; }

/* 설정창 내부 슬라이드 스위치 */
.switch { position: relative; display: inline-block; width: 34px; height: 18px; vertical-align: middle; }
.switch input { opacity: 0; width: 0; height: 0; }
.slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 18px; }
.slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 2px; bottom: 2px; background-color: white; transition: .4s; border-radius: 50%; }
input:checked + .slider { background-color: #27ae60; }
input:checked + .slider:before { transform: translateX(16px); }

.center-box { display: flex; justify-content: center; }
.side-box { display: flex; align-items: center; width: 100%; }
.side-box.left { justify-content: flex-end; padding-right: 8px; }
.side-box.right { justify-content: flex-start; padding-left: 8px; }

/* 기본 선수 공통 */
.player {
    position: absolute;
    transition: all 0.3s ease; /* 모양 바뀔 때 부드럽게 */
    overflow: hidden;
    z-index: 10 !important;
}

/* 원형 */
.player.shape-circle {
    border-radius: 50% !important;
    clip-path: circle(50% at 50% 50%);
}

/* 사각형 */
.player.shape-square {
    border-radius: 4px !important;
    clip-path: inset(0% 0% 0% 0% round 4px);
}

/* 삼각형 */
.player.shape-triangle {
    clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
    border: none !important; /* 삼각형일 땐 테두리가 어색할 수 있음 */
}

/* 유니폼 모양 */
.player.shape-jersey {
    clip-path: polygon(30% 0%, 70% 0%, 100% 20%, 85% 45%, 75% 35%, 75% 100%, 25% 100%, 25% 35%, 15% 45%, 0% 20%);
    border: none !important;
}

/* 세모와 유니폼에 번짐 없는 선명한 외곽선 적용 */
.player.shape-triangle, 
.player.shape-jersey {
    border: none !important;
    /* 상, 하, 좌, 우 4방향으로 1px씩 그림자를 겹쳐서 선처럼 보이게 함 */
    filter: drop-shadow(1px 0 0 #000) 
            drop-shadow(-1px 0 0 #000) 
            drop-shadow(0 1px 0 #000) 
            drop-shadow(0 -1px 0 #000);
}

/* 팀 색상으로 더 뚜렷하게 구분하고 싶다면 아래 코드 추가 */
.player[data-team="red"].shape-triangle, 
.player[data-team="red"].shape-jersey {
    filter: drop-shadow(1.5px 0 0 #330000) drop-shadow(-1.5px 0 0 #330000) 
            drop-shadow(0 1.5px 0 #330000) drop-shadow(0 -1.5px 0 #330000);
}

flex-wrap: nowrap;          /* 줄바꿈을 절대로 하지 않음 (한 줄 유지) */

}

let teamShapes = { red: 'circle', blue: 'circle' };
let isAlignVisible = false; 
let isOverlapPreventionActive = false; // 겹침 방지 활성 상태 (추가 권장)

let dragSrcEl = null; 
let targetX; // (참고: 이 변수는 보통 함수 내부 지역변수로 쓰이지만, 전역에 두셔도 무방합니다.)

// [4] 펜(그리기) 기능 상태
let penActive = false;
let isDrawing = false;
let points = [];

// [5] 녹화 및 시뮬레이션 엔진
let isRecording = false;
let isPlaying = false;
let recordedData = [];
let initialState = null;
let currentFrame = 0;
let lastRecordTime = 0;
let playbackId = null;
let playbackSpeed = 1;

    const field = document.getElementById('field'), ball = document.getElementById('ball'), bottomControls = document.getElementById('bottomControls');
    let currentFileName = "footballW_field_data.json";
    const persistentImages = { red: null, blue: null, field: null, ball: null };
    const activeDrags = new Map();

    function makeDraggable(el) {
      const onStart = (e) => {
if (e.target.closest('#bottomControls') || e.target.closest('#toggleMenuBtn')) {
        return; 
    }

const touches = e.changedTouches || [e];
    for (const t of touches) {
      const id = t.identifier !== undefined ? t.identifier : 'mouse';
      const rect = el.getBoundingClientRect();
      activeDrags.set(id, { 
        target: el, 
        offsetX: t.clientX - (rect.left + rect.width / 2), 
        offsetY: t.clientY - (rect.top + rect.height / 2) 
      });
      el.style.transition = "none";
      el.style.zIndex = 1000;
    }
  };

const onMove = (e) => {
        const touches = e.changedTouches || [e];
        for (const t of touches) {
          const id = t.identifier !== undefined ? t.identifier : 'mouse';
          const d = activeDrags.get(id);
          if (d && d.target === el) {
            const fr = field.getBoundingClientRect();
            let x = ((t.clientX - fr.left - d.offsetX) / fr.width) * 100;
            let y = ((t.clientY - fr.top - d.offsetY) / fr.height) * 100;
            
            el.style.left = Math.max(0, Math.min(100, x)) + "%";
            el.style.top = Math.max(0, Math.min(100, y)) + "%";

            if (isRecording) recordFrame();

            if (el.id !== 'ball') {
            preventOverlap(el); 
           }
          }
        };
        if (activeDrags.size > 0 && e.cancelable) e.preventDefault();
      };
      const onEnd = (e) => {
        const touches = e.changedTouches || [e];
        for (const t of touches) { activeDrags.delete(t.identifier !== undefined ? t.identifier : 'mouse'); }
el.style.zIndex = el.classList.contains('ball') ? 2000 : 5;

        setTimeout(() => { el.style.transition = "left 0.4s ease-out, top 0.4s ease-out"; }, 10);
      };
      el.addEventListener('mousedown', onStart);
      window.addEventListener('mousemove', onMove);
      window.addEventListener('mouseup', onEnd);
      el.addEventListener('touchstart', onStart, { passive: false });
      window.addEventListener('touchmove', onMove, { passive: false });
      window.addEventListener('touchend', onEnd);
    }

    // 실시간 팀 이름 색상 변경

      document.querySelectorAll(`.player[data-team="${team}"]`).forEach(p => p.style.color = color);
    }

  function addPlayer(t, n=null, x="50%", y="50%", c=null) {

  if(!name) return;
const chosenColor = c || document.getElementById(t+'ColorPicker').value;

  const currentFontSize = document.getElementById(t + 'FontSize').value;

  p.className = `player draggable shape-${currentShape}`; 
  p.innerText = name;

  p.style.left = x; 
  p.style.top = y; 
  p.dataset.team = t;
  p.style.color = chosenColor;
  p.style.zIndex = 10;

  p.style.width = currentSize + 'px';
  p.style.height = currentSize + 'px';
  p.style.fontSize = currentFontSize + 'px';
  
  if(persistentImages[t]) { 
    p.style.backgroundImage = `url(${persistentImages[t]})`; 
    p.style.backgroundColor = 'transparent'; 
  } else { 
    p.style.backgroundColor = 'rgba(0,0,0,0.3)'; 
  }

        p.style.pointerEvents = "none";
    }
  
updateAlignButtons();
  makeDraggable(p); 
  field.appendChild(p);


  // 3. 리스트 아이템 생성 및 연결
  const list = document.getElementById(t+'List'), item = document.createElement('div');
  item.className = 'list-item'; 
  item.playerEl = p; // 이 줄이 있어야 리스트 드래그 시 선수가 움직임
  
  item.setAttribute('draggable', 'true');
  item.dataset.team = t;

    <div class="drag-handle" style="cursor: grab; padding: 1px 25px; margin-left: -15px; color: #888; font-size: 20px; display: flex; align-items: center; justify-content: center;">☰</div>
    <span style="flex:1; font-weight:bold; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; pointer-events: none;">${name}</span>
    <div style="display:flex; gap:3px; padding-right: 5px;">
      <button class="btn-small" onclick="editPlayer(this)">수정</button>
      <button class="btn-small" style="color:red;" onclick="removePlayer(this)">삭제</button>
    </div>`;

  item.ondragstart = (e) => {
    // [핵심] 클릭된 대상이 'drag-handle'이 아니면 드래그 취소
    if (!e.target.closest('.drag-handle')) {
        e.preventDefault();
        return false;
    }
    handleDragStart.call(item, e);
};
  item.ondragover = handleDragOver;
  item.ondrop = handleDrop;
  item.ondragend = handleDragEnd;

const handle = item.querySelector('.drag-handle');
  handle.addEventListener('touchstart', function(e) {
    dragSrcEl = item; 
    item.style.opacity = '0.4';
    if (e.cancelable) e.stopPropagation();
  }, { passive: true });

item.addEventListener('touchmove', function(e) {
if (!dragSrcEl || dragSrcEl !== item) return;
    
if (e.cancelable) e.preventDefault();

    const touch = e.touches[0];
    const target = document.elementFromPoint(touch.clientX, touch.clientY);
    const overItem = target ? target.closest('.list-item') : null;

    if (overItem && overItem !== dragSrcEl && overItem.parentNode === item.parentNode) {
        const list = item.parentNode;
        const p1 = dragSrcEl.playerEl; // 현재 내가 잡고 있는 선수
        const p2 = overItem.playerEl;  // 내 손가락 아래에 있는 선수

        if (p1 && p2) {
            const tempLeft = p1.style.left;
            const tempTop = p1.style.top;

            p1.style.left = p2.style.left;
            p1.style.top = p2.style.top;

            p2.style.left = tempLeft;
            p2.style.top = tempTop;
        }

      const allItems = [...list.querySelectorAll('.list-item')];
      const currIdx = allItems.indexOf(dragSrcEl);
      const overIdx = allItems.indexOf(overItem);

      if (currIdx < overIdx) {
        list.insertBefore(dragSrcEl, overItem.nextSibling); // 아래로 이동
      } else {
        list.insertBefore(dragSrcEl, overItem); // 위로 이동
      }
    }
  }, { passive: false });

  item.addEventListener('touchend', function(e) {
    if (dragSrcEl) {

// 2. 드래그 오버: 드롭 허용
function handleDragOver(e) {
  if (e.preventDefault) e.preventDefault();

function handleDrop(e) {
  if (e.stopPropagation) e.stopPropagation();
  
  if (dragSrcEl !== this) {
    if (dragSrcEl.parentNode === this.parentNode) {
      const list = this.parentNode;
      
      // --- 추가된 로직: 경기장 위 실제 좌표 맞바꾸기 ---
      const p1 = dragSrcEl.playerEl; // 드래그한 선수 모형
      const p2 = this.playerEl;      // 놓은 위치에 있던 선수 모형

      if (p1 && p2) {
        // 서로의 좌표(left, top)를 백업 후 교체
        const tempLeft = p1.style.left;
        const tempTop = p1.style.top;

        p1.style.left = p2.style.left;
        p1.style.top = p2.style.top;

        p2.style.left = tempLeft;
        p2.style.top = tempTop;
      }


      const allItemsArray = [...list.querySelectorAll('.list-item')];
      if (allItemsArray.indexOf(dragSrcEl) < allItemsArray.indexOf(this)) {
        list.insertBefore(dragSrcEl, this.nextSibling);
      } else {
        list.insertBefore(dragSrcEl, this);
      }
      
      // 2. 겹침 순서(zIndex) 최신화
      list.querySelectorAll('.list-item').forEach((item, index) => {
        if (item.playerEl) item.playerEl.style.zIndex = 10 + index;
      });

      // 3. 자동 저장
      if (typeof autoSaveToLocal === 'function') autoSaveToLocal();
    }
  }
  return false;
}

function alignPlayers(team, isReverse = false) {
  const listItems = document.querySelectorAll(`#${team}List .list-item`);
  const players = Array.from(listItems).map(item => item.playerEl).filter(p => p);

  if (players.length === 0) return;

  const startY = 15; // 시작 높이 (%)
  const endY = 85;   // 끝 높이 (%)
  const playersPerCol = 10; // 한 열에 배치할 최대 인원수

  players.forEach((p, i) => {
    // 열 번호 계산 (0부터 시작)
    const colIndex = Math.floor(i / playersPerCol);
    // 열 내에서의 순서 (0~5)
    const rowIndex = i % playersPerCol;
    
    // 해당 열에 몇 명이 있는지 계산 (간격 조절용)
    const countInThisCol = (colIndex === Math.floor((players.length - 1) / playersPerCol)) 
                           ? (players.length % playersPerCol || playersPerCol) 
                           : playersPerCol;

    // 간격 계산
    const gap = countInThisCol > 1 ? (endY - startY) / (countInThisCol - 1) : 0;

    // X축 위치 결정 (열이 추가될 때마다 안쪽으로 7%씩 들어옴)

    if (team === 'red') {
      const baseRedX = isReverse ? 90 : 10;
      const offset = colIndex * 8; // 2열은 8% 더 안쪽으로
      targetX = isReverse ? baseRedX - offset : baseRedX + offset;
    } else {
      const baseBlueX = isReverse ? 10 : 90;
      const offset = colIndex * 8;
      targetX = isReverse ? baseBlueX + offset : baseBlueX - offset;
    }

    p.style.left = `${targetX}%`;
    p.style.top = countInThisCol > 1 ? `${startY + (gap * rowIndex)}%` : "50%";
  });

  if (typeof autoSaveToLocal === 'function') autoSaveToLocal();
}

function preventOverlap(activeEl) {
  if (!isOverlapPreventionActive) return;

const targets = document.querySelectorAll('.player, .ball'); 
  const activeRect = activeEl.getBoundingClientRect();
  const radius = activeRect.width / 2;

  targets.forEach(target => {
    if (target === activeEl) return;

    const targetRect = target.getBoundingClientRect();
    const dx = (activeRect.left + radius) - (targetRect.left + (targetRect.width / 2));
    const dy = (activeRect.top + radius) - (targetRect.top + (targetRect.height / 2));
    const distance = Math.sqrt(dx * dx + dy * dy);

    // 선수 지름의 90% 정도 거리 안에 들어오면 밀어냄
    const minDistance = activeRect.width * 0.95; 
    
    if (distance < minDistance && distance > 0) {
      const angle = Math.atan2(dy, dx);
      const push = (minDistance - distance) * 0.9;

target.style.transition = "left 0.1s linear, top 0.1s linear";

      const pushX = Math.cos(angle) * push;
      const pushY = Math.sin(angle) * push;

      const fr = field.getBoundingClientRect();
      // 밀려나는 선수의 새로운 좌표 (%) 계산
      let newX = ((targetRect.left - pushX - fr.left + (targetRect.width/2)) / fr.width) * 100;
      let newY = ((targetRect.top - pushY - fr.top + (targetRect.height/2)) / fr.height) * 100;

      target.style.left = Math.max(0, Math.min(100, newX)) + "%";
      target.style.top = Math.max(0, Math.min(100, newY)) + "%";

setTimeout(() => {
          target.style.transition = "left 0.15s ease-out, top 0.15s ease-out";
      }, 100);
    }
  });
}

    p.style.height = size + 'px';
    p.style.fontSize = fontSize + 'px';
    
    // 모양 클래스 일괄 적용
    p.classList.remove('shape-circle', 'shape-square', 'shape-triangle', 'shape-jersey');
    p.classList.add('shape-' + shape);
  });
  
  // 3. 저장
  autoSaveToLocal();
}

function togglePenToolbar(isVisible) {
    const penToolbar = document.getElementById('penToolbar');
    if (!penToolbar) return;
    penToolbar.style.display = isVisible ? 'flex' : 'none';
    if (!isVisible && penActive) togglePenMode();
}

function toggleSimulationBar(checked) {
    const simBar = document.getElementById('simControlBar');
    if (checked) {
        simBar.classList.remove('hidden');
    } else {
        simBar.classList.add('hidden');

}


const canvas = document.getElementById('drawingCanvas');
const ctx = canvas.getContext('2d');

function zoomField(zone) {
    const field = document.getElementById('field'); 
    const container = document.getElementById('field-container');
    if (!field || !container) return;

    if (zone === 'reset') {
        field.style.transform = "scale(1)";
        field.style.transformOrigin = "top center";
        field.style.marginBottom = "0px"; // 리셋 시 여백 제거
        container.style.overflow = "hidden";
        container.scrollTo(0, 0);
    } else {
        container.style.overflowY = "auto";
        container.style.overflowX = "hidden"; 

        field.style.transition = "transform 0.5s ease-out";
        
        // 1. 배율 설정 (시야를 넓게 보려면 1.3~1.5 추천)
        const zoomLevel = 2.5; 
        field.style.transform = `scale(${zoomLevel})`;

        // 2. [핵심] 현재 기기 화면 높이만큼 하단 여백을 자동으로 계산
        // 화면 높이(vh)만큼 여백을 주면, 경기장 맨 아래쪽 라인을 화면 맨 위까지 끌어올릴 수 있습니다.
        const screenHeight = window.innerHeight * 2.5;
        field.style.marginBottom = `${screenHeight * 0.2}px`; // 화면 높이의 80% 정도를 여유 공간으로 확보

        // 3. 구역별 기준점 설정
        switch(zone) {
            case 'left': field.style.transformOrigin = "top left"; break;
            case 'center': field.style.transformOrigin = "top center"; break;
            case 'right': field.style.transformOrigin = "top right"; break;
        }

        setTimeout(() => {
            container.scrollTop = 0;
        }, 50);
    }
}

function getMousePos(canvas, evt) {
        const rect = canvas.getBoundingClientRect();
        const clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
        const clientY = evt.touches ? evt.touches[0].clientY : evt.clientY;

        return {
            x: (clientX - rect.left) / currentZoom,
            y: (clientY - rect.top) / currentZoom
        };
    }

function togglePenMode() {
    const btn = document.getElementById('penToggleBtn');
    const container = document.getElementById('field-container');
    const players = document.querySelectorAll('.player');
    const ball = document.getElementById('ball');

    penActive = !penActive;

    if (penActive) {
        btn.innerHTML = "🖍️";
btn.style.fontSize = "20px";
        btn.style.background = "#e74c3c";
     
        canvas.style.zIndex = "100"; // 확실하게 위로 올림   
canvas.style.pointerEvents = "auto";

        // 3. 선수와 공을 클릭 불가능하게 (드래그 방지)
        players.forEach(p => p.style.pointerEvents = "none");
        ball.style.pointerEvents = "none";

const container = document.getElementById('field-container');
        canvas.width = container.offsetWidth;
        canvas.height = container.offsetHeight;
    } else {
        btn.innerHTML = "🖍️";
btn.style.fontSize = "20px";
        btn.style.background = "#ffffff";

// 2. 캔버스를 비활성화 (아래 요소 클릭 가능하게)
        canvas.style.pointerEvents = "none";

        // 3. 선수와 공을 다시 클릭 가능하게
        players.forEach(p => p.style.pointerEvents = "auto");
        ball.style.pointerEvents = "auto";
    }
}


// 기존 stopDrawing 함수를 아래처럼 수정 (저장 로직 추가)
function stopDrawing() { 
    if(isDrawing) saveState(); 
    isDrawing = false; 
}

// --- 펜 기능 핵심 로직 ---



function updateLineWidth(v) { if(ctx) {
        ctx.lineWidth = v;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
    } }


function changePenColor(v) { if(ctx) ctx.strokeStyle = v; }

function clearCanvas()  {
        ctx.clearRect(0, 0, canvas.width, canvas.height); 
}

function getCanvasPos(e) {
    const rect = canvas.getBoundingClientRect();
    const clientX = e.clientX || (e.touches && e.touches[0].clientX);
    const clientY = e.clientY || (e.touches && e.touches[0].clientY);
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
}

window.addEventListener('mousedown', (e) => {
    if (!penActive) return;
    // 버튼이나 입력창을 누를 때는 그리기 방지
    if (e.target.closest('#penToolbar') || e.target.closest('#bottomControls')) return;

    isDrawing = true;
    const {x, y} = getCanvasPos(e);
    ctx.beginPath();
    ctx.moveTo(x, y);
    
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.lineWidth = document.getElementById('penWidth').value;
    ctx.strokeStyle = document.getElementById('penColorPicker').value;
});

window.addEventListener('mousemove', (e) => {
    if (!isDrawing || !penActive) return; // 클릭 상태(isDrawing)가 true일 때만 실행
    const {x, y} = getCanvasPos(e);
    ctx.lineTo(x, y);
    ctx.stroke();
});

window.addEventListener('mouseup', () => {
    isDrawing = false; // 마우스를 떼면 더 이상 그려지지 않음
});

// 터치 모바일 지원
window.addEventListener('touchstart', (e) => {
    if (!penActive || e.target.closest('#penToolbar')) return;
    isDrawing = true;
    const {x, y} = getCanvasPos(e);
    ctx.beginPath();
    ctx.moveTo(x, y);
}, {passive: false});

window.addEventListener('touchmove', (e) => {
    if (!isDrawing || !penActive) return;
    const {x, y} = getCanvasPos(e);
    ctx.lineTo(x, y);
    ctx.stroke();
    if(e.cancelable) e.preventDefault();
}, {passive: false});

window.addEventListener('touchend', () => { isDrawing = false; });




function startDrawing(e) {
    if (!penActive) return;
    if (e.target.closest('#penToolbar') || e.target.closest('#bottomControls')) return;

    isDrawing = true;
    const pos = getCanvasPos(e);
    points = [pos]; // 시작점 저장
    
    ctx.beginPath();
    ctx.moveTo(pos.x, pos.y);
    
    // 펜 스타일 설정
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.lineWidth = document.getElementById('penWidth').value;
    ctx.strokeStyle = document.getElementById('penColorPicker').value;
}

function draw(e) {
    if (!isDrawing || !penActive) return;
    
    const pos = getCanvasPos(e);
    points.push(pos);

    if (points.length > 2) {
        // 마지막 세 점을 이용해 부드러운 곡선(베지어 곡선) 계산
        const lastTwoPoints = points.slice(-2);
        const controlPoint = lastTwoPoints[0];
        const endPoint = {
            x: (lastTwoPoints[0].x + lastTwoPoints[1].x) / 2,
            y: (lastTwoPoints[0].y + lastTwoPoints[1].y) / 2
        };

        ctx.quadraticCurveTo(controlPoint.x, controlPoint.y, endPoint.x, endPoint.y);
        ctx.stroke();
    }
}
function stopDrawing() { 
    isDrawing = false; 
}



// 1. 녹화 시작/중지 토글
function startRecording() {
    const recBtn = document.getElementById('recBtn');
    
    if (!isRecording) {

        initialState = {
            ball: { x: ball.style.left, y: ball.style.top },
            players: Array.from(document.querySelectorAll('.player')).map(p => ({
                name: p.innerText,
                x: p.style.left,
                y: p.style.top
            }))
        };

        isRecording = true;
        recordedData = []; // 이전 데이터 초기화
        recBtn.style.background = "#ffcccc"; // 녹화 중 표시
        recBtn.querySelector('i').classList.replace('fa-circle', 'fa-square');
        console.log("녹화 시작...");
    } else {
        // 녹화 중지
        isRecording = false;
        recBtn.style.background = "#ffffff";
        recBtn.querySelector('i').classList.replace('fa-square', 'fa-circle');
        resetToInitialState();
        console.log("녹화 종료 및 위치 복구 완료");
setTimeout(() => {
            alert("녹화가 완료되었습니다. 재생 버튼을 눌러보세요!");
        }, 100);
    }
}


function recordFrame() {

const now = Date.now();
    // 30ms(약 0.03초)마다 한 번씩만 기록하도록 제한 (데이터 최적화)
    if (now - lastRecordTime < 30) return;

// 필드의 현재 실시간 크기 파악
    const fW = field.offsetWidth;
    const fH = field.offsetHeight;

const frame = {
        ball: { 
            x: (ball.offsetLeft / fW) * 100, 
            y: (ball.offsetTop / fH) * 100 
        },
        players: Array.from(document.querySelectorAll('.player')).map(p => ({
            name: p.innerText, // 이름 기반 매칭 유지
            id: p.id,
            x: (p.offsetLeft / fW) * 100, 
            y: (p.offsetTop / fH) * 100
        }))
    };

    recordedData.push(frame);
    lastRecordTime = now;
}



function playSimulation() {
    if (recordedData.length === 0) return alert("녹화된 데이터가 없습니다.");
    if (isPlaying) return;

    isPlaying = true;
    let frameIndex = 0;
    let lastTime = 0;
    
    // 초당 30프레임 정도로 제한 (녹화 시와 유사하게 부드러운 속도)
    const fps = 30; 
    const interval = 1000 / fps;

    document.querySelectorAll('.player, .ball').forEach(el => el.style.transition = "none");

    function nextFrame(timestamp) {
        if (!isPlaying) return;
        if (currentFrame >= recordedData.length) {
            stopSimulation();
            return;
        }

        // 시간 차이를 계산하여 일정한 프레임 속도로 재생
        const deltaTime = timestamp - lastTime;

        if (deltaTime >= interval / playbackSpeed) {
            const data = recordedData[currentFrame];
            
        const fW = field.offsetWidth;
        const fH = field.offsetHeight;

            // 공 이동
        ball.style.left = (data.ball.x * fW / 100) + "px";
        ball.style.top = (data.ball.y * fH / 100) + "px";
            // 선수들 이동
            data.players.forEach(pData => {
                const playerEl = Array.from(document.querySelectorAll('.player'))
                                      .find(el => el.innerText === pData.name);
                if (playerEl) {
                playerEl.style.left = (pData.x * fW / 100) + "px";
                playerEl.style.top = (pData.y * fH / 100) + "px";
                }
            });

            currentFrame++;
            lastTime = timestamp;
        }
        
        playbackId = requestAnimationFrame(nextFrame);
    }
    playbackId = requestAnimationFrame(nextFrame);
}

// 4. 재생 일시정지
function pauseSimulation() {
    isPlaying = false;
    cancelAnimationFrame(playbackId);
}

// 5. 정지 (초기화)
function stopSimulation() {
    isPlaying = false;
    isRecording = false;
    currentFrame = 0;
    cancelAnimationFrame(playbackId);
    
if (recordedData && recordedData.length > 0) {
    resetToInitialState();
}

    // UI 복구
    const recBtn = document.getElementById('recBtn');
if(recBtn) {
    recBtn.style.background = "#ffffff";
    recBtn.querySelector('i').className = "fas fa-circle";
    recBtn.querySelector('i').style.color = "#ff4d4d";
}

    document.querySelectorAll('.player, .ball').forEach(el => {
        el.style.transition = "left 0.4s ease-out, top 0.4s ease-out";
    });
}

function resetToInitialState() {
    // 저장된 초기 위치 데이터(initialState)가 없으면 아무것도 안 함
    if (!initialState) return;

    // 1. 순간 이동처럼 보이게 하기 위해 애니메이션 잠시 끔
    const elements = document.querySelectorAll('.player, .ball');
    elements.forEach(el => el.style.transition = "none");

    // 2. 공 위치를 녹화 시작 시점으로 복구
    ball.style.left = initialState.ball.x;
    ball.style.top = initialState.ball.y;

    // 3. 모든 선수 위치를 이름 기준으로 찾아 복구
  initialState.players.forEach(pData => {
        // [수정] dataset.name으로 찾거나, 없으면 innerText로 찾음
        const playerEl = Array.from(document.querySelectorAll('.player'))
                              .find(el => (el.dataset.name === pData.name) || (el.innerText === pData.name));
      if (playerEl) {
            playerEl.style.left = pData.x;
            playerEl.style.top = pData.y;
        }
    });

    // 4. 복구가 끝난 뒤 다시 부드러운 움직임(transition)을 켬
    setTimeout(() => {
        elements.forEach(el => {
            el.style.transition = "left 0.4s ease-out, top 0.4s ease-out";
        });
    }, 50);
}
