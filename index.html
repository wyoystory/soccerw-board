/* ------------- 백그라운드 이미지 ------------------ */

/* 정렬 구역 기본 상태: 숨김 */
#alignSector {
    display: none;
    align-items: center;

/* 정렬 구역이 활성화되었을 때만 왼쪽에 칸막이 추가 */
#alignSector.has-divider {
    border-left: 2px solid #ddd !important;
}

#alignSector:has(.red-btns:not(.hidden):not([style*="display: none"])),
#alignSector:has(.blue-btns:not(.hidden):not([style*="display: none"])) {
    display: flex !important;
}

#redAlignBtn { color: var(--red-color); }
#blueAlignBtn { color: var(--blue-color); }

#drawingCanvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
z-index: 3;
    pointer-events: none; /* 기본 상태에서는 아래 플레이어 클릭 가능하도록 설정 */
}

#field-container, #field, #field-content, #field * {
    -webkit-user-drag: none;
    -khtml-user-drag: none;
    -moz-user-drag: none;
    -o-user-drag: none;
    user-drag: none;
}

#field-container {
width: 100%;
    height: calc(100dvh - 110px); 
    max-width: 100vw;
    margin: 0 auto;
    position: relative;
    box-sizing: border-box;

    /* 컨테이너 내부에서 필드를 중앙 배치 및 최대 크기로 고정 */
    display: flex;
    justify-content: center;
    align-items: center;
}

/* 필드 조절 */
#field {
width: min(100%, calc((100dvh - 110px) * (105 / 68)));
    aspect-ratio: 105 / 68;
    
    background-color: #27ae60; 
    background-size: 100% 100%; 
    border: 4px solid #fff; 
    position: relative; 
    z-index: 1; 
    overflow: hidden; 
    box-sizing: border-box;
touch-action: manipulation;
}

#field-content {
    width: 100%;
    height: 100%;
    position: absolute;
    top: 0;
    left: 0;
    transition: transform 0.3s ease-out; 
transform-origin: center center !important;
    position: relative;
}    

.player, .ball, #ball {
    position: absolute !important; /* #field-content 내부 기준 절대 좌표 */
    z-index: 10; /* 필드 배경 및 캔버스보다 위에 배치 */
    transform: translate(-50%, -50%); /* 센터 정렬 기준 유지 */

    /* ★ 안드로이드 스마트폰 터치 필수 속성 ★ */
    touch-action: none !important;      /* 브라우저 기본 스크롤/줌 제스처 완전 차단 */
    pointer-events: auto !important;   /* 터치/클릭 이벤트 수신 허용 */
    -webkit-user-select: none;          /* 꾹 눌렀을 때 텍스트 선택 방지 */
    user-select: none;
}

.field-wrapper {
    overflow: hidden; 
    position: relative;
    width: 100%; /* 부모 너비에 맞춤 */
}

/* 배경 이미지 레이어 */
#field-bg {
  position: absolute;
  top: 0; left: 0; width: 100%; height: 100%;
  background-size: 100% 100%;
  z-index: 1; /* 가장 아래 */
}

/* 라인 이미지 레이어 (투명 PNG 권장) */
#field-lines {
  position: absolute;
  top: 0; left: 0; width: 100%; height: 100%;

  background-size: 100% 100%;

  z-index: 2; /* 배경보다 위 */
}

      pointer-events: auto; 
width: 95%; 
max-width: calc(85vh * 1.414);

.top-toolbar, 
#simControlBar, 
.setting-btn-container, /* 설정 버튼을 감싸고 있는 요소 클래스/ID명 */

display: flex;
  align-items: center;

/* 정렬 버튼 스타일 */
.align-btn {
display: flex !important;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  padding: 0 !important;
  margin: 0 !important;
  border: none !important;
  outline: none !important;
  background: transparent !important;
  box-shadow: none !important;
  cursor: pointer;
  flex-shrink: 0;
}

/* 정렬 버튼 안의 이미지 스타일 */
.align-btn img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}
.hidden { display: none !important; }

/* 설정창 내부 슬라이드 스위치 */
.switch { position: relative; display: inline-block; width: 34px; height: 18px; vertical-align: middle; }
.switch input { opacity: 0; width: 0; height: 0; }
.slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 18px; }
.slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 2px; bottom: 2px; background-color: white; transition: .4s; border-radius: 50%; }
input:checked + .slider { background-color: #27ae60; }
input:checked + .slider:before { transform: translateX(16px); }

.center-box { display: flex; justify-content: center; }
.side-box { display: flex; align-items: center; width: 100%; }
.side-box.left { justify-content: flex-end; padding-right: 8px; }
.side-box.right { justify-content: flex-start; padding-left: 8px; }

/* 기본 선수 공통 (기존 코드 + 안드로이드 터치 속성 추가) */
.player {
    position: absolute;
    transition: all 0.3s ease; /* 모양 바뀔 때 부드럽게 */
    overflow: hidden;
    z-index: 10 !important;

    /* ★ 안드로이드 스마트폰 터치 필수 속성 추가 ★ */
    touch-action: none !important;      /* 브라우저 기본 스크롤/줌 동작 차단 */
    pointer-events: auto !important;   /* 터치 이벤트 수신 허용 */
    -webkit-user-select: none;          /* 꾹 눌렀을 때 텍스트 선택 방지 */
    user-select: none;
}

/* ★ 바로 아래에 새로 추가할 코드 (선수 내부 텍스트/등번호 터치 씹힘 방지) ★ */
.player * {
    touch-action: none !important;
    pointer-events: none; /* 내부 요소가 아닌 부모 .player가 터치를 받도록 처리 */
}

/* 원형 */
.player.shape-circle {
    border-radius: 50% !important;
    clip-path: circle(50% at 50% 50%);
}

/* 사각형 */
.player.shape-square {
    border-radius: 4px !important;
    clip-path: inset(0% 0% 0% 0% round 4px);
}

/* 삼각형 */
.player.shape-triangle {
    clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
    border: none !important; /* 삼각형일 땐 테두리가 어색할 수 있음 */
}

/* 유니폼 모양 */
.player.shape-jersey {
    clip-path: polygon(30% 0%, 70% 0%, 100% 20%, 85% 45%, 75% 35%, 75% 100%, 25% 100%, 25% 35%, 15% 45%, 0% 20%);
    border: none !important;
}

/* 세모와 유니폼에 번짐 없는 선명한 외곽선 적용 */
.player.shape-triangle, 
.player.shape-jersey {
    border: none !important;
    /* 상, 하, 좌, 우 4방향으로 1px씩 그림자를 겹쳐서 선처럼 보이게 함 */
    filter: drop-shadow(1px 0 0 #000) 
            drop-shadow(-1px 0 0 #000) 
            drop-shadow(0 1px 0 #000) 
            drop-shadow(0 -1px 0 #000);
}

/* 팀 색상으로 더 뚜렷하게 구분하고 싶다면 아래 코드 추가 */
.player[data-team="red"].shape-triangle, 
.player[data-team="red"].shape-jersey {
    filter: drop-shadow(1.5px 0 0 #330000) drop-shadow(-1.5px 0 0 #330000) 
            drop-shadow(0 1.5px 0 #330000) drop-shadow(0 -1.5px 0 #330000);
}

.player-list-item {

let isOverlapPreventionActive = false; 

let dragSrcEl = null; 
let targetX; 

let penActive = false;
let isDrawing = false;
let points = [];

let isRecording = false;
let isPlaying = false;
let recordedData = [];
let initialState = null;
let currentFrame = 0;
let lastRecordTime = 0;
let playbackId = null;
let playbackSpeed = 1;

let currentFileName = "footballW_field_data.json";
const persistentImages = { red: null, blue: null, field: null, ball: null };
const activeDrags = new Map();

// DOM 요소 (스크립트 로드 시점 대응)
let field, ball, bottomControls;

window.addEventListener('DOMContentLoaded', () => {
    field = document.getElementById('field');
    ball = document.getElementById('ball');
    bottomControls = document.getElementById('bottomControls');

    if (ball) {
        makeDraggable(ball);
    }

    if (field) {
        // [PC 전용] 필드 내 더블 클릭 확대 및 기본 동작 완전 차단
        field.addEventListener('dblclick', (e) => {
            const isTargetObject = e.target.closest('.ball, #ball, .player, button, input, select, .sim-btn, .setting-modal');
            if (!isTargetObject) {
                e.preventDefault();
                e.stopPropagation();
            }
        }, true);

        // 기존 click 차단 코드
        field.addEventListener('click', (e) => {
            const isTargetObject = e.target.closest('.ball, #ball, .player, button, input, select, .sim-btn, .setting-modal');
            if (!isTargetObject) {
                e.preventDefault();
                e.stopPropagation();
            }
        }, true);
    }
});


// [2] 드래그 앤 드롭 엔진 (스마트폰 터치 불통 및 확대 보정 완료)
function makeDraggable(el) {
  const onStart = (e) => {
    if (e.target.closest('#bottomControls') || e.target.closest('#toggleMenuBtn')) return;

    // 터치 이벤트 발생 시 스마트폰 기본 스크롤/제스처 차단
    if (e.cancelable) e.preventDefault();

    const isTouch = e.type === 'touchstart';
    const touches = isTouch ? e.changedTouches : [e];

    for (let i = 0; i < touches.length; i++) {
      const t = touches[i];
      const id = isTouch ? t.identifier : 'mouse';

      // 터치한 요소가 현재 el 요소 또는 el 내부의 자식 요소인지 검사
      const targetNode = e.target;
      if (isTouch && targetNode !== el && !el.contains(targetNode)) continue;

      activeDrags.set(id, { 
        target: el, 
        startX: t.clientX,
        startY: t.clientY,
        initialLeftPercent: parseFloat(el.style.left) || 50,
        initialTopPercent: parseFloat(el.style.top) || 50
      });
      
      el.style.transition = "none";
      const isBall = (el.id === 'ball' || el.classList.contains('ball'));
      el.style.zIndex = isBall ? 2000 : 1000;
      break;
    }
  };

  const onMove = (e) => {
    const isTouch = e.type === 'touchmove';
    const touches = isTouch ? e.changedTouches : [e];

    for (let i = 0; i < touches.length; i++) {
      const t = touches[i];
      const id = isTouch ? t.identifier : 'mouse';
      const d = activeDrags.get(id);

      if (d && d.target === el) {
        const content = document.getElementById('field-content') || document.getElementById('field');
        const cr = content.getBoundingClientRect();
        const scale = (typeof zoomScale !== 'undefined' && zoomScale > 0) ? zoomScale : 1.0;

        const unscaledWidth = cr.width / scale;
        const unscaledHeight = cr.height / scale;

        // 이동 거리 계산 (줌 스케일 보정)
        const deltaX = (t.clientX - d.startX) / scale;
        const deltaY = (t.clientY - d.startY) / scale;

        const deltaPercentX = (deltaX / unscaledWidth) * 100;
        const deltaPercentY = (deltaY / unscaledHeight) * 100;

        let x = d.initialLeftPercent + deltaPercentX;
        let y = d.initialTopPercent + deltaPercentY;
        
        x = Math.max(0, Math.min(100, x));
        y = Math.max(0, Math.min(100, y));

        el.style.left = x + "%";
        el.style.top = y + "%";

        if (typeof isRecording !== 'undefined' && isRecording && typeof recordFrame === 'function') {
            recordFrame();
        }
        if (typeof preventOverlap === 'function') {
            preventOverlap(el); 
        }
      }
    }
    if (activeDrags.size > 0 && e.cancelable) e.preventDefault();
  };

  const onEnd = (e) => {
    const isTouch = e.type === 'touchend' || e.type === 'touchcancel';
    const touches = isTouch ? (e.changedTouches || []) : [e];

    for (let i = 0; i < touches.length; i++) { 
      const t = touches[i];
      const id = isTouch ? t.identifier : 'mouse';
      activeDrags.delete(id); 
    }
    
    if (activeDrags.size === 0) {
      const isBall = (el.id === 'ball' || el.classList.contains('ball'));
      el.style.zIndex = isBall ? 2000 : 5;
      setTimeout(() => { 
        el.style.transition = "left 0.4s ease-out, top 0.4s ease-out"; 
      }, 10);
    }
  };

  // 마우스 및 터치 이벤트 직접 연결
  el.addEventListener('mousedown', onStart);
  window.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onEnd);
  
  el.addEventListener('touchstart', onStart, { passive: false });
  window.addEventListener('touchmove', onMove, { passive: false });
  window.addEventListener('touchend', onEnd);
  window.addEventListener('touchcancel', onEnd);
}

function changeTeamNameColor(team, color) {
  document.querySelectorAll(`.player[data-team="${team}"]`).forEach(p => p.style.color = color);
}

// [3] 선수 추가 및 리스트 관리
function addPlayer(t, n=null, x="50%", y="50%", c=null, id=null) {
  const input = document.getElementById(t+'Input');
  const name = n || (input ? input.value.trim() : "");
  if(!name) return;
  
  const targetField = field || document.getElementById('field');
  const picker = document.getElementById(t+'ColorPicker');
  const chosenColor = c || (picker ? picker.value : '#000000');
  const p = document.createElement('div');
  
  const currentShape = teamShapes[t] || 'circle';
  const sizeInput = document.getElementById(t + 'PlayerSize');
  const fontInput = document.getElementById(t + 'FontSize');
  const currentSize = sizeInput ? sizeInput.value : '40';
  const currentFontSize = fontInput ? fontInput.value : '14';

  p.className = `player draggable shape-${currentShape}`; 
  p.innerText = name; 
  p.dataset.name = name;
  p.style.left = x; 
  p.style.top = y; 
  p.dataset.team = t;
  p.style.color = chosenColor;
  p.style.zIndex = 10;

  p.id = id || ('player_' + Date.now() + '_' + Math.floor(Math.random() * 1000));

  p.style.width = currentSize + 'px';
  p.style.height = currentSize + 'px';
  p.style.fontSize = currentFontSize + 'px';
  
  if(persistentImages[t]) { 
    p.style.backgroundImage = `url(${persistentImages[t]})`; 
    p.style.backgroundColor = 'transparent'; 
  } else { 
    p.style.backgroundColor = 'rgba(0,0,0,0.3)'; 
  }

  if (penActive) p.style.pointerEvents = "none";
  
  updateAlignButtons();
  makeDraggable(p); 
  if(targetField) targetField.appendChild(p);

  const list = document.getElementById(t+'List');
  if(!list) return p;

  const item = document.createElement('div');
  item.className = 'list-item'; 
  item.playerEl = p; 
  item.setAttribute('draggable', 'true');
  item.dataset.team = t;

  item.innerHTML = `
    <div class="drag-handle" style="cursor: grab; padding: 1px 25px; margin-left: -15px; color: #888; font-size: 20px; display: flex; align-items: center; justify-content: center;">☰</div>
    <span style="flex:1; font-weight:bold; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; pointer-events: none;">${name}</span>
    <div style="display:flex; gap:3px; padding-right: 5px;">
      <button class="btn-small" onclick="editPlayer(this)">수정</button>
      <button class="btn-small" style="color:red;" onclick="removePlayer(this)">삭제</button>
    </div>`;

  item.ondragstart = (e) => {
    if (!e.target.closest('.drag-handle')) { e.preventDefault(); return false; }
    handleDragStart.call(item, e);
  };
  item.ondragover = handleDragOver;
  item.ondrop = handleDrop;
  item.ondragend = handleDragEnd;

  const handle = item.querySelector('.drag-handle');
  handle.addEventListener('touchstart', function(e) {
    dragSrcEl = item; 
    item.style.opacity = '0.4';
    if (e.cancelable) e.stopPropagation();
  }, { passive: true });

  item.addEventListener('touchmove', function(e) {
    if (!dragSrcEl || dragSrcEl !== item) return;
    if (e.cancelable) e.preventDefault();

    const touch = e.touches[0];
    const target = document.elementFromPoint(touch.clientX, touch.clientY);
    const overItem = target ? target.closest('.list-item') : null;

    if (overItem && overItem !== dragSrcEl && overItem.parentNode === item.parentNode) {
        const parentList = item.parentNode;
        const p1 = dragSrcEl.playerEl; 
        const p2 = overItem.playerEl;  

        if (p1 && p2) {
            const tempLeft = p1.style.left;
            const tempTop = p1.style.top;
            p1.style.left = p2.style.left;
            p1.style.top = p2.style.top;
            p2.style.left = tempLeft;
            p2.style.top = tempTop;
        }

      const allItems = [...parentList.querySelectorAll('.list-item')];
      const currIdx = allItems.indexOf(dragSrcEl);
      const overIdx = allItems.indexOf(overItem);

      if (currIdx < overIdx) parentList.insertBefore(dragSrcEl, overItem.nextSibling); 
      else parentList.insertBefore(dragSrcEl, overItem); 
    }
  }, { passive: false });

  item.addEventListener('touchend', function(e) {
    if (dragSrcEl) {
      dragSrcEl.style.opacity = '1';
      const parentList = item.parentNode; 
      parentList.querySelectorAll('.list-item').forEach((it, idx) => {
        if (it.playerEl) it.playerEl.style.zIndex = 20 + idx;
      });
      autoSaveToLocal();
    }
    dragSrcEl = null;
  }, { passive: true });

  list.appendChild(item); 
  if(!n && input) input.value = ""; 
  updateAlignButtons();

  return p;
}

// [4] 데이터 저장 및 로드
function saveData() {
    const fn = prompt("파일명 입력:", currentFileName.replace(".json", ""));
    if (!fn) return;
    
    const targetBall = ball || document.getElementById('ball');
    const players = Array.from(document.querySelectorAll('.player')).map(p => ({
        id: p.id,
        name: p.innerText, 
        team: p.dataset.team, 
        x: p.style.left, 
        y: p.style.top, 
        color: p.style.color
    }));

    const config = { 
        players, 
        ball: { x: targetBall.style.left, y: targetBall.style.top, size: targetBall.style.width || "45px" }, 
        images: persistentImages,
        simulation: recordedData 
    };

    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(config)], {type: "application/json"}));
    a.download = fn + ".json"; 
    a.click();
}

function autoSaveToLocal() {
  const targetBall = ball || document.getElementById('ball');
  const players = Array.from(document.querySelectorAll('.player')).map(p => ({
    id: p.id,
    name: p.innerText, 
    team: p.dataset.team, 
    x: p.style.left, 
    y: p.style.top, 
    color: p.style.color
  }));
  const config = { 
    players, 
    ball: { x: targetBall ? targetBall.style.left : "50%", y: targetBall ? targetBall.style.top : "50%", size: targetBall ? (targetBall.style.width || "45px") : "45px" }, 
    images: persistentImages 
  };
  localStorage.setItem('soccerAutoSave', JSON.stringify(config));
}

function renderData(d) {
    document.querySelectorAll('.player, .list-item').forEach(el => el.remove());
    const targetField = field || document.getElementById('field');
    const targetBall = ball || document.getElementById('ball');

    const defaultField = 'https://postfiles.pstatic.net/MjAyNjAxMjlfMjI1/MDAxNzY5NjM1Mjc0NjQ5.502_CqNalGrTYu6ZLubeKv3k_Yi01fCGmv4_tRIq_a4g.BvhqNdBmteUb3ZSa07vyILSugnFty_RPVM18IN9cxYAg.PNG/field.png?type=w580';
    if(targetField) targetField.style.backgroundImage = `url('${defaultField}')`;
    const fieldName = document.getElementById('fieldNameDisplay');
    if(fieldName) fieldName.innerText = "지정 안됨";
    persistentImages.field = null;

    if (d.images) {
        Object.assign(persistentImages, d.images);
        if (d.images.field) {
            const bgLayer = document.getElementById('field-bg');
            if(bgLayer) bgLayer.style.backgroundImage = `url(${d.images.field})`;
            if(fieldName) fieldName.innerText = "불러온 배경";
        }
        if (d.images.red) setExternalImage('red', d.images.red);
        if (d.images.blue) setExternalImage('blue', d.images.blue);
        if (d.images.ball && targetBall) {
            targetBall.style.backgroundImage = `url('${d.images.ball}')`;
            targetBall.style.backgroundColor = 'transparent';
            targetBall.style.backgroundSize = 'cover';
            const ballName = document.getElementById('ballFileName');
            if(ballName) ballName.innerText = "저장된 공";
        }
    }

    if (d.players) {
        d.players.forEach(p => {
            const playerEl = addPlayer(p.team, p.name, p.x, p.y, p.color, p.id);
            if (playerEl) {
                playerEl.style.transition = "none";
                playerEl.style.left = p.x;
                playerEl.style.top = p.y;
                setTimeout(() => {
                    playerEl.style.transition = "left 0.4s ease-out, top 0.4s ease-out";
                }, 50);
            }
        });
    }

    if (d.ball && targetBall) {
        targetBall.style.transition = "none";
        targetBall.style.left = d.ball.x;
        targetBall.style.top = d.ball.y;
        setTimeout(() => {
            targetBall.style.transition = "left 0.4s ease-out, top 0.4s ease-out";
        }, 50);
    }

    if (d.simulation && d.simulation.length > 0) {
        recordedData = d.simulation;
    } else {
        recordedData = [];
    }
}

function loadData(event) {
    const file = event.target.files[0]; 
    if (!file || !confirm("데이터를 불러오시겠습니까?")) return;
    const reader = new FileReader();
    reader.onload = (e) => {
        lastLoadedData = e.target.result; 
        const d = JSON.parse(e.target.result);
        renderData(d); 
    };
    reader.readAsText(file);
    event.target.value = '';
}

// [5] 헬퍼 및 기타 UI 함수들
function handleDragStart(e) { dragSrcEl = this; this.style.opacity = '0.4'; e.dataTransfer.effectAllowed = 'move'; }
function handleDragOver(e) { if (e.preventDefault) e.preventDefault(); return false; }
function handleDrop(e) {
  if (e.stopPropagation) e.stopPropagation();
  if (dragSrcEl !== this && dragSrcEl.parentNode === this.parentNode) {
      const list = this.parentNode;
      const p1 = dragSrcEl.playerEl; 
      const p2 = this.playerEl;      

      if (p1 && p2) {
        const tempLeft = p1.style.left;
        const tempTop = p1.style.top;
        p1.style.left = p2.style.left;
        p1.style.top = p2.style.top;
        p2.style.left = tempLeft;
        p2.style.top = tempTop;
      }

      const allItemsArray = [...list.querySelectorAll('.list-item')];
      if (allItemsArray.indexOf(dragSrcEl) < allItemsArray.indexOf(this)) {
        list.insertBefore(dragSrcEl, this.nextSibling);
      } else {
        list.insertBefore(dragSrcEl, this);
      }
      
      list.querySelectorAll('.list-item').forEach((item, index) => {
        if (item.playerEl) item.playerEl.style.zIndex = 10 + index;
      });

      autoSaveToLocal();
  }
  return false;
}
function handleDragEnd(e) { this.style.opacity = '1'; }

function setExternalImage(target, url) {
  if (!url) return;
  const img = new Image();
  img.crossOrigin = "Anonymous"; 
  img.src = url;
  img.onload = function() {
    if(target === 'field') {
      const targetField = field || document.getElementById('field');
      if(targetField) targetField.style.backgroundImage = `url('${url}')`;
    } else {
      document.querySelectorAll(`.player[data-team="${target}"]`).forEach(p => {
        p.style.backgroundImage = `url('${url}')`;
        p.style.backgroundColor = 'transparent';
      });
    }
  };
}

function revertToLastFile() {
    if (!lastLoadedData) return alert("최근에 불러온 파일 데이터가 없습니다.");
    if (confirm("불러왔던 파일의 초기 상태로 되돌리시겠습니까?")) {
        renderData(JSON.parse(lastLoadedData));
    }
}

function takeScreenshot() {
  const targetControls = bottomControls || document.getElementById('bottomControls');
  const wasCollapsed = targetControls ? targetControls.classList.contains('collapsed') : false;
  if (!wasCollapsed) toggleMenu(); 

  setTimeout(() => {
    const target = document.querySelector("#field");
    html2canvas(target, {
      useCORS: true, allowTaint: true, scale: 2, backgroundColor: "#27ae60", logging: true,
      width: target.offsetWidth, height: target.offsetHeight
    }).then(canvas => {
      try {
        const link = document.createElement('a');
        const now = new Date();
        const dateStr = now.toISOString().slice(0, 10).replace(/-/g, "");
        const timeStr = String(now.getHours()).padStart(2, '0') + String(now.getMinutes()).padStart(2, '0');
        link.download = `${dateStr}_${timeStr}_soccerW.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
      } catch (e) {
        alert("브라우저 보안 설정으로 인해 스크린샷을 생성할 수 없습니다.");
      }
      if (!wasCollapsed) toggleMenu(); 
    });
  }, 500);
}

async function handleImageUpload(e, t) {
  const f = e.target.files[0]; if(!f) return;
  const b = await new Promise(r=>{
    const rd=new FileReader(); rd.readAsDataURL(f); rd.onload=()=>r(rd.result);
  });
  persistentImages[t] = b;
  const targetBall = ball || document.getElementById('ball');
  
  if(t === 'field') { 
      document.getElementById('field-bg').style.backgroundImage = `url(${b})`; 
      document.getElementById('fieldNameDisplay').innerText = "배경:" + f.name; 
  } else if(t==='ball' && targetBall) {
      targetBall.style.backgroundImage = `url(${b})`;
      targetBall.style.backgroundColor = 'transparent';
      targetBall.style.backgroundSize = 'cover';
      targetBall.style.backgroundPosition = 'center';
      document.getElementById('ballFileName').innerText = "공:" + f.name;
  } else { 
      document.querySelectorAll(`.player[data-team="${t}"]`).forEach(p=>{ 
        p.style.backgroundImage=`url(${b})`; 
        p.style.backgroundColor = 'transparent'; 
        p.style.backgroundSize = 'cover';
        p.style.backgroundPosition = 'center';
      }); 
      document.getElementById(t+'FileName').innerText = f.name; 
  }
}

  const targetBall = ball || document.getElementById('ball');
  if(targetBall) {
    targetBall.style.width = v + 'px';
    targetBall.style.height = v + 'px';
  }
}

function applyFormation(t, f) {
  const list = document.getElementById(t+'List');
  if(!list) return;
  const ps = Array.from(list.children).map(it => it.playerEl), forms = {'4-4-2':[[10,50],[20,20],[20,40],[20,60],[20,80],[32,20],[32,40],[32,60],[32,80],[44,35],[44,65]],'4-3-3':[[10,50],[20,20],[20,40],[20,60],[20,80],[32,30],[32,50],[32,70],[44,20],[44,50],[44,80]],'3-5-2':[[10,50],[20,25],[20,50],[20,75],[32,15],[32,32],[32,50],[32,68],[32,85],[44,35],[44,65]]};
  const pos = forms[f]; if(!pos) return;
  ps.forEach((p, i)=>{ if(pos[i] && p){ let x=t==='blue'?100-pos[i][0]:pos[i][0]; p.style.left=x+"%"; p.style.top=pos[i][1]+"%"; }});
}

function toggleMenu() { 
    const targetControls = bottomControls || document.getElementById('bottomControls');
    if(!targetControls) return;
    const col = targetControls.classList.toggle('collapsed'); 
    const menuImg = document.getElementById('toggleMenuImg');
    if (menuImg) menuImg.src = col ? "setting.png" : "setting_.png"; 
}

function updateMenuOpacity(v) { 
    const targetControls = bottomControls || document.getElementById('bottomControls');
    if(targetControls) targetControls.style.opacity = v / 100; 
}

function resetAll() {
    if (!confirm("모든 데이터를 지우고 처음 상태로 되돌리시겠습니까?")) return;
    localStorage.removeItem('soccerAutoSave'); 
    localStorage.removeItem('tacticBoardData'); 
    location.reload(); 
}

function removePlayer(btn) { 
  const it = btn.closest('.list-item'); 
  if (it.playerEl) it.playerEl.remove(); 
  it.remove(); 
  updateAlignButtons();
}

function editPlayer(btn) {
  const it = btn.closest('.list-item'), span = it.querySelector('span'), newName = prompt("수정:", span.innerText);
  if(newName) { span.innerText = newName; if(it.playerEl) it.playerEl.innerText = newName; }
}

function adjustZoom(val) {
  const container = document.getElementById('field-container');
  const zoomText = document.getElementById('zoomVal');
  if(container) container.style.width = val + 'px';
  if(zoomText) zoomText.innerText = val + 'px';
}

document.addEventListener('touchstart', function (e) { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
document.addEventListener('touchend', function (e) {
  const now = (new Date()).getTime();
  if (now - lastTouchEnd <= 300) e.preventDefault();
  lastTouchEnd = now;
}, false);

function updateAlignButtons() {
    document.querySelectorAll('.red-btns, .blue-btns').forEach(btn => {
        btn.style.display = isAlignVisible ? "inline-block" : "none";
        btn.classList.toggle('hidden', !isAlignVisible);
    });
}

function toggleAlignButtons(show) { isAlignVisible = show; updateAlignButtons(); }

function alignPlayers(team, isReverse = false) {
  const listItems = document.querySelectorAll(`#${team}List .list-item`);
  const players = Array.from(listItems).map(item => item.playerEl).filter(p => p);
  if (players.length === 0) return;

  const startY = 15, endY = 85, playersPerCol = 10; 

  players.forEach((p, i) => {
    const colIndex = Math.floor(i / playersPerCol);
    const rowIndex = i % playersPerCol;
    const countInThisCol = (colIndex === Math.floor((players.length - 1) / playersPerCol)) ? (players.length % playersPerCol || playersPerCol) : playersPerCol;
    const gap = countInThisCol > 1 ? (endY - startY) / (countInThisCol - 1) : 0;

    if (team === 'red') {
      const baseRedX = isReverse ? 90 : 10;
      targetX = isReverse ? baseRedX - (colIndex * 8) : baseRedX + (colIndex * 8);
    } else {
      const baseBlueX = isReverse ? 10 : 90;
      targetX = isReverse ? baseBlueX + (colIndex * 8) : baseBlueX - (colIndex * 8);
    }

    p.style.left = `${targetX}%`;
    p.style.top = countInThisCol > 1 ? `${startY + (gap * rowIndex)}%` : "50%";
  });

  autoSaveToLocal();
}
function toggleOverlap() {
    // boolean 값으로 명확히 지정
    isOverlapPrevented = !isOverlapPrevented; 
}

function toggleOverlapPrevention(show) { isOverlapPreventionActive = show; }
// 프레임 중복 계산 방지를 위한 변수
let isOverlapPending = false;

function preventOverlap(activeEl) {
  if (typeof isOverlapPreventionActive !== 'undefined' && !isOverlapPreventionActive) return;
  if (isOverlapPending) return; // 모바일 렌더링 과부하 차단

  isOverlapPending = true;

  // 스마트폰 화면 주사율(60Hz~120Hz)에 맞춘 프레임 최적화
  requestAnimationFrame(() => {
    isOverlapPending = false;

    const targetField = typeof field !== 'undefined' && field ? field : document.getElementById('field');
    const targets = document.querySelectorAll('.player, .ball, #ball'); 
    const activeRect = activeEl.getBoundingClientRect();
    
    const radius = activeRect.width / 2;
    const activeCenterX = activeRect.left + radius;
    const activeCenterY = activeRect.top + radius;
    
    // 자연스러운 물리 충돌 판단 거리
    const minDistance = radius * 0.6;

    targets.forEach(target => {
      if (target === activeEl) return;
      
      const targetRect = target.getBoundingClientRect();
      const targetCenterX = targetRect.left + (targetRect.width / 2);
      const targetCenterY = targetRect.top + (targetRect.height / 2);
      
      const dx = activeCenterX - targetCenterX;
      const dy = activeCenterY - targetCenterY;
      const distance = Math.hypot(dx, dy);
      
      if (distance < minDistance && distance > 0) {
        const angle = Math.atan2(dy, dx);
        
        // ★ 컴퓨터와 동일한 부드러운 쿠션감을 주는 완충 계수 (0.05)
        const overlap = minDistance - distance;
        const push = overlap * 0.05;

        // 즉각적 반응을 위해 트랜지션 해제
        target.style.transition = "none";

        const pushX = Math.cos(angle) * push;
        const pushY = Math.sin(angle) * push;
        const fr = targetField.getBoundingClientRect();

        const currentScale = (typeof zoomScale !== 'undefined' && zoomScale > 0) ? zoomScale : 1.0;
        const unscaledWidth = fr.width / currentScale;
        const unscaledHeight = fr.height / currentScale;

        let newX = ((targetRect.left - pushX - fr.left + (targetRect.width / 2)) / currentScale / unscaledWidth) * 100;
        let newY = ((targetRect.top - pushY - fr.top + (targetRect.height / 2)) / currentScale / unscaledHeight) * 100;

        target.style.left = Math.max(0, Math.min(100, newX)) + "%";
        target.style.top = Math.max(0, Math.min(100, newY)) + "%";
      }
    });
  });
}

function preventOverlap(draggedEl) {
    // 겹침 방지 스위치 체크
    if (typeof isOverlapPreventionActive === 'undefined' || !isOverlapPreventionActive) return;

    // ★ [밀림 세기 조절 변수] (원하는 수치로 자유롭게 수정하세요)
    const PLAYER_PUSH_FACTOR = 0.1; // 선수끼리 부딪혔을 때 밀리는 세기 (0.1 ~ 0.5 권장)
    const BALL_PUSH_FACTOR   = 0.15; // 공과 부딪혔을 때 밀리는 세기

    const scale = (typeof zoomScale !== 'undefined' && zoomScale > 0) ? zoomScale : 1.0;
    const content = document.getElementById('field-content') || document.getElementById('field');
    const contentRect = content.getBoundingClientRect();
    
    const unscaledWidth = contentRect.width / scale;
    const unscaledHeight = contentRect.height / scale;

    // 밀어낼 대상 목록 수집 (공 + 드래그 중인 본인을 제외한 모든 선수)
    const targets = [];
    const ballEl = document.getElementById('ball');
    if (ballEl && draggedEl !== ballEl) {
        targets.push(ballEl);
    }

    const allPlayers = document.querySelectorAll('.player');
    allPlayers.forEach(p => {
        if (p !== draggedEl) {
            targets.push(p);
        }
    });

    const r1 = draggedEl.getBoundingClientRect();
    const c1x = r1.left + r1.width / 2;
    const c1y = r1.top + r1.height / 2;

    targets.forEach(targetEl => {
        const isBall = (targetEl === ballEl);
        
        const r2 = targetEl.getBoundingClientRect();
        const c2x = r2.left + r2.width / 2;
        const c2y = r2.top + r2.height / 2;

        const dx = c2x - c1x;
        const dy = c2y - c1y;
        const distance = Math.hypot(dx, dy);

        // 충돌 기준 거리 (두 요소 반경의 합)
        const minDistanceScaled = (r1.width + r2.width) / 2;

        if (distance < minDistanceScaled && distance > 0) {
            // ★ 대상이 공인지 선수인지에 따라 밀림 세기 차등 적용
            const pushFactor = isBall ? BALL_PUSH_FACTOR : PLAYER_PUSH_FACTOR;
            const overlap = (minDistanceScaled - distance) * pushFactor; 
            
            const nx = dx / distance;
            const ny = dy / distance;

            const pushPixelX = (nx * overlap) / scale;
            const pushPixelY = (ny * overlap) / scale;

            const pushPercentX = (pushPixelX / unscaledWidth) * 100;
            const pushPercentY = (pushPixelY / unscaledHeight) * 100;

            let currentLeft = parseFloat(targetEl.style.left) || 50;
            let currentTop = parseFloat(targetEl.style.top) || 50;

            let newLeft = currentLeft + pushPercentX;
            let newTop = currentTop + pushPercentY;

            // 필드 이탈 방지 (0% ~ 100%)
            targetEl.style.left = Math.max(0, Math.min(100, newLeft)) + "%";
            targetEl.style.top = Math.max(0, Math.min(100, newTop)) + "%";

            if (typeof isRecording !== 'undefined' && isRecording && typeof recordFrame === 'function') {
                recordFrame();
            }
        }
    });
}

function changeShape(team, shape) {
  teamShapes[team] = shape;
  if (typeof event !== 'undefined' && event && event.currentTarget) {
    const btnGroup = event.currentTarget.parentElement;
    btnGroup.querySelectorAll('.shape-btn').forEach(btn => btn.classList.remove('active'));
    event.currentTarget.classList.add('active');
  }
  updateTeamStyle(team);
}

function updateTeamStyle(team) {
  const size = document.getElementById(team + 'PlayerSize').value;
  const fontSize = document.getElementById(team + 'FontSize').value;
  const shape = teamShapes[team] || 'circle';

  document.querySelectorAll(`.player[data-team="${team}"]`).forEach(p => {
    p.style.width = size + 'px';
    p.style.height = size + 'px';
    p.style.fontSize = fontSize + 'px';
    p.classList.remove('shape-circle', 'shape-square', 'shape-triangle', 'shape-jersey');
    p.classList.add('shape-' + shape);
  });
  autoSaveToLocal();
}

function togglePenToolbar(isVisible) {
    const penToolbar = document.getElementById('penToolbar');
    if (!penToolbar) return;
    penToolbar.style.display = isVisible ? 'flex' : 'none';
    if (!isVisible && penActive) togglePenMode();
}

function toggleSimulationBar(checked) {
    const simBar = document.getElementById('simControlBar');
    if (!simBar) return;
    if (checked) simBar.classList.remove('hidden');
    else simBar.classList.add('hidden');
}

// [6] 펜 및 캔버스 그리기 기능
function togglePenMode() {
    const penImg = document.getElementById('penBtnImg');
    const container = document.getElementById('field-container');
    const players = document.querySelectorAll('.player');
    const targetBall = ball || document.getElementById('ball');
    const canvas = document.getElementById('drawingCanvas');

    penActive = !penActive;

    if (penActive) {
        if (penImg) penImg.src = 'pen1.png';
        if (canvas && container) {
            canvas.style.zIndex = "100"; 
            canvas.style.pointerEvents = "auto";
// 캔버스 크기가 다를 때만 초기화하여 기존 그림 유지
            if (canvas.width !== container.offsetWidth || canvas.height !== container.offsetHeight) {
                canvas.width = container.offsetWidth;
                canvas.height = container.offsetHeight;
            }
        }
        players.forEach(p => p.style.pointerEvents = "none");
        if (targetBall) targetBall.style.pointerEvents = "none";
    } else {
        if (penImg) penImg.src = 'pen.png';
        if (canvas) canvas.style.pointerEvents = "none";
        players.forEach(p => p.style.pointerEvents = "auto");
        if (targetBall) targetBall.style.pointerEvents = "auto";
    }
}

function getCanvasPos(e) {
    const canvas = document.getElementById('drawingCanvas');
    if(!canvas) return { x: 0, y: 0 };
    const rect = canvas.getBoundingClientRect();
    const clientX = e.clientX || (e.touches && e.touches[0].clientX);
    const clientY = e.clientY || (e.touches && e.touches[0].clientY);
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
}

window.addEventListener('mousedown', startDrawing);
window.addEventListener('mousemove', draw);
window.addEventListener('mouseup', stopDrawing);
window.addEventListener('touchstart', startDrawing, { passive: false });
window.addEventListener('touchmove', (e) => {
    if (penActive && isDrawing) {
        draw(e);
        if (e.cancelable) e.preventDefault();
    }
}, { passive: false });

window.addEventListener('touchend', stopDrawing);

function startDrawing(e) {
    if (!penActive) return;
    if (e.target.closest('#penToolbar') || e.target.closest('#bottomControls')) return;

    const canvas = document.getElementById('drawingCanvas');
    if(!canvas) return;
    const ctx = canvas.getContext('2d');

    isDrawing = true;
    const pos = getCanvasPos(e);
    points = [pos]; 
    
    ctx.beginPath();
    ctx.moveTo(pos.x, pos.y);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.lineWidth = document.getElementById('penWidth').value;
    ctx.strokeStyle = document.getElementById('penColorPicker').value;
}

function draw(e) {
    if (!isDrawing || !penActive) return;
    const canvas = document.getElementById('drawingCanvas');
    if(!canvas) return;
    const ctx = canvas.getContext('2d');
    
    const pos = getCanvasPos(e);
    points.push(pos);

    if (points.length > 2) {
        const lastTwoPoints = points.slice(-2);
        const controlPoint = lastTwoPoints[0];
        const endPoint = {
            x: (lastTwoPoints[0].x + lastTwoPoints[1].x) / 2,
            y: (lastTwoPoints[0].y + lastTwoPoints[1].y) / 2
        };
        ctx.quadraticCurveTo(controlPoint.x, controlPoint.y, endPoint.x, endPoint.y);
        ctx.stroke();
    }
}

function stopDrawing() { isDrawing = false; }
function clearCanvas() {
    const canvas = document.getElementById('drawingCanvas');
    if(canvas) {
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height); 
    }
}

// [7] 녹화 및 시뮬레이션 제어
function startRecording() {
    const recImg = document.getElementById('recordBtnImg');
    const targetField = field || document.getElementById('field');
    const targetBall = ball || document.getElementById('ball');
    const fW = targetField.offsetWidth;
    const fH = targetField.offsetHeight;
    
    if (!isRecording) {
        initialState = {
            ball: { 
                x: (targetBall.offsetLeft / fW) * 100, 
                y: (targetBall.offsetTop / fH) * 100 
            },
            players: Array.from(document.querySelectorAll('.player')).map(p => ({
                id: p.id,
                x: (p.offsetLeft / fW) * 100,
                y: (p.offsetTop / fH) * 100
            }))
        };

        isRecording = true;
        recordedData = [];
        lastRecordTime = 0;
        if (recImg) recImg.src = 'record1.png';
        recordFrame(true); 
    } else {
        isRecording = false;
        if (recImg) recImg.src = 'record.png';
        resetToInitialState();
        setTimeout(() => alert("녹화가 완료되었습니다."), 100);
    }
}

function recordFrame(force = false) {
    if (!isRecording) return;
    const now = Date.now();
    if (!force && (now - lastRecordTime < 30)) return;

    const targetField = field || document.getElementById('field');
    const targetBall = ball || document.getElementById('ball');
    const fW = targetField.offsetWidth;
    const fH = targetField.offsetHeight;

    const frame = {
        ball: { 
            x: (targetBall.offsetLeft / fW) * 100, 
            y: (targetBall.offsetTop / fH) * 100 
        },
        players: Array.from(document.querySelectorAll('.player')).map(p => ({
            id: p.id, 
            x: (p.offsetLeft / fW) * 100, 
            y: (p.offsetTop / fH) * 100
        }))
    };

    recordedData.push(frame);
    lastRecordTime = now;
}

function playSimulation() {
    if (recordedData.length === 0) return alert("녹화된 데이터가 없습니다.");
    if (isPlaying) return;

    isPlaying = true;
    currentFrame = 0;
    const playImg = document.getElementById('playBtnImg');
    if (playImg) playImg.src = 'play1.png';

    let lastTime = 0;
    const fps = 30; 
    const interval = 1000 / fps;
    const targetBall = ball || document.getElementById('ball');

    document.querySelectorAll('.player, .ball').forEach(el => el.style.transition = "none");

    function nextFrame(timestamp) {
        if (!isPlaying) return;
        if (currentFrame >= recordedData.length) {
            stopSimulation();
            return;
        }

        const deltaTime = timestamp - lastTime;
        if (deltaTime >= interval / (playbackSpeed || 1)) {
            const data = recordedData[currentFrame];

            if(targetBall) {
                targetBall.style.left = data.ball.x + "%";
                targetBall.style.top = data.ball.y + "%";
            }

            data.players.forEach(pData => {
                const playerEl = document.getElementById(pData.id);
                if (playerEl) {
                    playerEl.style.left = pData.x + "%";
                    playerEl.style.top = pData.y + "%";
                }
            });

            currentFrame++;
            lastTime = timestamp;
        }
        playbackId = requestAnimationFrame(nextFrame);
    }
    playbackId = requestAnimationFrame(nextFrame);
}

function resetToInitialState() {
    if (!initialState) return;
    const targetBall = ball || document.getElementById('ball');
    const elements = document.querySelectorAll('.player, .ball');
    
    elements.forEach(el => el.style.transition = "none");

    if(targetBall) {
        targetBall.style.left = initialState.ball.x + "%";
        targetBall.style.top = initialState.ball.y + "%";
    }

    initialState.players.forEach(pData => {
        const playerEl = document.getElementById(pData.id);
        if (playerEl) {
            playerEl.style.left = pData.x + "%";
            playerEl.style.top = pData.y + "%";
        }
    });

    setTimeout(() => {
        elements.forEach(el => {
            el.style.transition = "left 0.4s ease-out, top 0.4s ease-out";
        });
    }, 50);
}

function pauseSimulation() {
    isPlaying = false;
    cancelAnimationFrame(playbackId);
    const playImg = document.getElementById('playBtnImg');
    if (playImg) playImg.src = 'play.png';
}

function stopSimulation() {
    isPlaying = false;
    isRecording = false;
    currentFrame = 0;
    cancelAnimationFrame(playbackId);

    const playImg = document.getElementById('playBtnImg');
    const recImg = document.getElementById('recordBtnImg');
    if (playImg) playImg.src = 'play.png';
    if (recImg) recImg.src = 'record.png';
    
    if (recordedData && recordedData.length > 0) resetToInitialState();

    document.querySelectorAll('.player, .ball').forEach(el => {
        el.style.transition = "left 0.4s ease-out, top 0.4s ease-out";
    });
}

// [8] 반응형 캔버스 해상도 자동 동기화
function updateCanvasSize() {
    const targetField = field || document.getElementById('field');
    const canvas = document.getElementById('drawingCanvas');
    
    if (targetField && canvas) {
        const rect = targetField.getBoundingClientRect();
        if (canvas.width !== rect.width || canvas.height !== rect.height) {
            canvas.width = rect.width;
            canvas.height = rect.height;
        }
    }
}

// 화면 크기 변경 시 및 로드 시 실행
window.addEventListener('resize', updateCanvasSize);
window.addEventListener('DOMContentLoaded', updateCanvasSize);

let currentZoomState = 'center'; // 'left', 'center', 'right', 'reset'
let zoomScale = 1.0; // 초기 화면 스케일 (기본 1.0배)
let panX = 0, panY = 0;
let isPanning = false;
let startX = 0, startY = 0;

// 줌 변환 실행 함수
function applyTransform() {
    const content = document.getElementById('field-content');
    if (content) {
        content.style.transform = `scale(${zoomScale}) translate(${panX}%, ${panY}%)`;
    }
}

// 줌 버튼 클릭 시 실행되는 함수
function zoomField(position) {
    const content = document.getElementById('field-content');
    if (!content) return;

    if (typeof currentZoomState !== 'undefined') {
        currentZoomState = position;
    }

    switch (position) {
        case 'left':
            zoomScale = 1.5; panX = 16.5; panY = 0;
            break;
        case 'right':
            zoomScale = 1.5; panX = -16.5; panY = 0;
            break;
        case 'center':
            zoomScale = 1.5; panX = 0; panY = 0;
            break;
        case 'reset':
        default:
            zoomScale = 1; panX = 0; panY = 0;
            applyTransform();
            return;
    }

    applyTransform();
}

function resetZoom() {
    zoomField('reset');
}

const fieldElem = document.getElementById('field');

if (fieldElem) {
    // 터치 / 마우스 드래그 시작
    const startPan = (e) => {
        // ★ 핵심 1: 전체 화면(1배 이하) 상태에서는 필드를 누르거나 드래그해도 반응하지 않도록 차단
        if (typeof zoomScale === 'undefined' || zoomScale <= 1) return;
        
        // 버튼, 선수, 공, 설정창, 캔버스 드로잉 관련 클릭 시 드래그 동작 안 함
        const isInteractive = e.target.closest('#ball, .ball, .player, .sim-btn, button, input, select, .setting-modal, #settingModal, [onclick]');
        if (isInteractive) return;

        isPanning = true;
        
        const content = document.getElementById('field-content');
        if (content) content.classList.add('is-dragging');

        const pageX = e.touches ? e.touches[0].pageX : e.pageX;
        const pageY = e.touches ? e.touches[0].pageY : e.pageY;
        
        startX = pageX;
        startY = pageY;
    };

    // 마우스 / 손가락 이동 (필드 화면 밀기)
    const movePan = (e) => {
        // ★ 핵심 2: 줌(1.5배)이 실제로 되어있지 않거나 드래그 중이 아니면 화면 이동 방지
        if (!isPanning || zoomScale <= 1) return;
        
        const pageX = e.touches ? e.touches[0].pageX : e.pageX;
        const pageY = e.touches ? e.touches[0].pageY : e.pageY;

        const deltaX = (pageX - startX) * 0.08; 
        const deltaY = (pageY - startY) * 0.08;

        panX += deltaX;
        panY += deltaY;

        // 위아래/좌우 이동 범위 제한
        panX = Math.max(-35, Math.min(35, panX));
        panY = Math.max(-30, Math.min(30, panY));

        startX = pageX;
        startY = pageY;

        applyTransform();
    };

    // 드래그 종료
    const endPan = () => { 
        isPanning = false; 
        const content = document.getElementById('field-content');
        if (content) content.classList.remove('is-dragging');
    };

    // PC 마우스 이벤트
    fieldElem.addEventListener('mousedown', startPan);
    window.addEventListener('mousemove', movePan);
    window.addEventListener('mouseup', endPan);

    // 모바일 터치 이벤트
    fieldElem.addEventListener('touchstart', startPan, { passive: true });
    window.addEventListener('touchmove', movePan, { passive: true });
    window.addEventListener('touchend', endPan);
    window.addEventListener('touchcancel', endPan);
}

function fixPlayerLayers() {
    const field = document.getElementById('field');
    const fieldContent = document.getElementById('field-content');
    
    if (!field || !fieldContent) return;

    // #field 바로 아래에 잘못 위치한 모든 선수(.player)들을 #field-content 안으로 자동 이동
    const misplacedPlayers = field.querySelectorAll(':scope > .player');
    misplacedPlayers.forEach(player => {
        fieldContent.appendChild(player);
    });
}

// 1. 페이지 로드 완료 시 자동 실행
document.addEventListener('DOMContentLoaded', fixPlayerLayers);

// 2. 줌(zoomField)이 실행될 때도 혹시 몰라 한 번 더 실행하여 보정
const originalZoomField = window.zoomField;
window.zoomField = function(position) {
    fixPlayerLayers(); // 선수 레이어 위치 강제 보정
    if (typeof originalZoomField === 'function') {
        originalZoomField(position);
    }
};


// 모바일 브라우저 당겨서 새로고침(Pull-to-Refresh) 완전 차단
document.addEventListener('touchmove', function(e) {
  // 터치 위치가 필드 또는 작전판 전체 영역 내부일 때 새로고침 동작 차단
  if (e.cancelable) {
    e.preventDefault();
  }
}, { passive: false });


</script>
